name: Rebuild line routes

# Regenerates line_routes.csv from the latest Wiener Linien GTFS once a week and
# commits it, so the app's "update transit data" (and its weekly background refresh)
# pull an up-to-date table from raw.githubusercontent.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-routes
  cancel-in-progress: false

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive line_routes.csv from GTFS
        run: python tools/build_routes.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- wear-app/app/src/main/assets/line_routes.csv; then
            echo "No route changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wear-app/app/src/main/assets/line_routes.csv
          git commit -m "chore: refresh line_routes.csv from GTFS"
          git push
