org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
# These two are deprecated in AGP 9 but still required by the standalone Kotlin
# plugins (android/compose/serialization) this project applies: built-in Kotlin
# clashes with applying kotlin.android, and the new DSL exposes an extension the
# older KGP casts to BaseExtension (ClassCastException). Keeping newDsl=false also
# re-enables the legacy variant API, which is why the build still logs the
# applicationVariants/testVariants/unitTestVariants "obsolete API" warnings. All of
# this clears together only when migrating to AGP's built-in Kotlin + new DSL.
android.builtInKotlin=false
android.newDsl=false
